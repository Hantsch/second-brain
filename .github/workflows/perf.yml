name: perf

# Advisory lane for wall-clock budgets (`*.perf.test.ts`). A budget overrun is a
# ::warning annotation on the run, never a red check, and neither verify nor the
# release ever waits for this lane: a runner's speed is not the code's fault.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The perf tests drive core code only; the Electron binary is not needed.
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Perf budgets
        run: npm run test:perf
