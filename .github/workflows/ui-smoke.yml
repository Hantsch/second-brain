name: ui-smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed demo vault
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Screenshot the app
        run: npm run shot

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .screenshots/
