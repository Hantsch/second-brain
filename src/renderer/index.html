<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- Kein eval, keine fremden Quellen. `unsafe-inline` bleibt nötig, weil
         Vite im Entwicklungsmodus einen Inline-Modul-Vorspann einsetzt. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'"
    />
    <title>Gaston</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
